# User/password MySQL: hanya di .env (lihat .env.example), bukan di file ini.

connections:
  - name: mypas
    host: 172.21.5.94
    port: 3306
    databases:
      - kocak_2
      - lab_report

topology:
  source:
    name: master-94
    host: 172.21.5.94
    port: 3306
    role: source
    os: windows
    connection: mypas
    label: PRODUCTION MASTER
  clones:
    - name: clone-13-30
      host: 172.21.13.30
      port: 3306
      role: clone
      os: linux
      replicate_from: master-94
      ssh_user: development
      ssh_port: 22
      docker_container: mariadb-server
      docker_sudo: true
      label: DATABASE CLONE
    - name: clone-13-31
      host: 172.21.13.31
      port: 3306
      role: clone
      os: linux
      replicate_from: clone-13-30
      ssh_user: development
      ssh_port: 22
      label: DATABASE CLONE

monitor:
  poll_interval_seconds: 30
  lag_warning_seconds: 60
  disk_low_percent: 15
  cpu_high_percent: 90
  ram_high_percent: 90
  alert_cooldown_minutes: 30
  growth_percent_24h: 20
  binlog_risk_ratio: 0.5
