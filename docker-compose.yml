services:
  backup:
    build: .
    container_name: mysql-gdrive-backup
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Jakarta
      CONFIG_PATH: config/config.yaml
      GOOGLE_OAUTH_CLIENT: config/oauth-client.json
      GOOGLE_OAUTH_TOKEN: config/token.json
      STATE_PATH: state/fingerprints.json
    volumes:
      - backup-config:/app/config
      - backup-state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Dashboard Clone DB (host port default 8095) — bukan backup Drive
  monitor:
    build: .
    container_name: mariadb-clone-monitor
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Jakarta
      # Path terpisah dari /app/config (volume backup) — hindari mount file vs folder
      CONFIG_PATH: /app/monitor-config.yaml
      MONITOR_DATA_DIR: monitor-data
    command: ["/bin/sh", "/app/scripts/monitor-entrypoint.sh"]
    ports:
      - "${MONITOR_HOST_PORT:-8095}:8090"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/monitor-config.yaml
        read_only: true
        bind:
          create_host_path: false
      - monitor-data:/app/monitor-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  backup-config:
  backup-state:
  monitor-data:
