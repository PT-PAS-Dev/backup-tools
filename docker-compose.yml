services:
  backup:
    build: .
    container_name: mysql-gdrive-backup
    env_file: .env
    environment:
      TZ: Asia/Jakarta
      CONFIG_PATH: config/config.yaml
      GOOGLE_OAUTH_CLIENT: config/oauth-client.json
      GOOGLE_OAUTH_TOKEN: config/token.json
      STATE_PATH: state/fingerprints.json
    volumes:
      - backup-config:/app/config
      - backup-state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Dashboard Clone DB (web :8090) — bukan backup Drive
  monitor:
    build: .
    container_name: mariadb-clone-monitor
    env_file: .env
    environment:
      TZ: Asia/Jakarta
      CONFIG_PATH: config/config.yaml
      MONITOR_DATA_DIR: monitor-data
    command: uvicorn monitor.app:app --host 0.0.0.0 --port 8090
    ports:
      - "8090:8090"
    volumes:
      - backup-config:/app/config
      - ./config.yaml:/app/config/config.yaml:ro
      - ./monitor:/app/monitor:ro
      - monitor-data:/app/monitor-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  backup-config:
  backup-state:
  monitor-data:
